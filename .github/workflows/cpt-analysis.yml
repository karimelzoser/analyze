name: CPT Silt Analysis

on:
  push:
    branches:
      - analysis-work
    paths-ignore:
      - 'analysis_output/**'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pymupdf numpy

      - name: Analyze every CPT PDF twice
        run: python analysis/analyze_cpt.py

      - name: Commit audit results to analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_output
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Generate CPT silt analysis results"
            git push origin HEAD:analysis-work
          fi
