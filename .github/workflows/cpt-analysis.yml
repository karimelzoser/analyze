name: CPT Silt Analysis

on:
  push:
    branches:
      - analysis-work
    paths-ignore:
      - 'analysis_output/**'
      - 'analysis_output_v2/**'
      - 'analysis_output_v3/**'
      - 'analysis_output_v4/**'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pymupdf numpy

      - name: Analyze all CPT PDFs with mandatory independent double verification
        run: python analysis/analyze_cpt_v4.py

      - name: Upload final analysis audit
        uses: actions/upload-artifact@v4
        with:
          name: cpt-analysis-v4
          path: analysis_output_v4/
          retention-days: 7

      - name: Commit final audit to analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_output_v4
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Generate final double-verified CPT analysis results v4"
            git fetch origin analysis-work
            git rebase origin/analysis-work
            git push origin HEAD:analysis-work
          fi
