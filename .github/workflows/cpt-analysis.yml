name: CPT Silt Analysis

on:
  push:
    branches:
      - analysis-work
    paths-ignore:
      - 'analysis_output/**'
      - 'analysis_output_v2/**'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pymupdf numpy

      - name: Analyze every CPT PDF twice with exact depth calibration
        run: python analysis/analyze_cpt_v2.py

      - name: Upload v2 audit results
        uses: actions/upload-artifact@v4
        with:
          name: cpt-analysis-v2
          path: analysis_output_v2/
          retention-days: 7

      - name: Commit v2 audit results to analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_output_v2
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Generate exact-depth CPT analysis results v2"
            git fetch origin analysis-work
            git rebase origin/analysis-work
            git push origin HEAD:analysis-work
          fi
