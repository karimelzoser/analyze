name: Build CPT Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop_app/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_app/requirements.txt pyinstaller pytest

      - name: Run automated tests
        shell: pwsh
        working-directory: desktop_app
        run: |
          python -m pytest -q

      - name: Professional reporting smoke test
        shell: pwsh
        working-directory: desktop_app
        run: |
          python -m py_compile app_professional_final.py app_pro.py reporting_pro.py reporting_pdf_ref.py reporting_pdf_ref_v2.py cpt_core.py

      - name: Build executable
        shell: pwsh
        working-directory: desktop_app
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name CPT_Silt_Analyzer `
            --collect-all matplotlib `
            app_professional_final.py

      - name: Package repository download ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if (Test-Path 'release/CPT_Silt_Analyzer_Latest.zip') {
            Remove-Item 'release/CPT_Silt_Analyzer_Latest.zip' -Force
          }
          Compress-Archive `
            -Path 'desktop_app/dist/CPT_Silt_Analyzer.exe' `
            -DestinationPath 'release/CPT_Silt_Analyzer_Latest.zip' `
            -CompressionLevel Optimal
          Get-Item 'release/CPT_Silt_Analyzer_Latest.zip' | Select-Object FullName,Length

      - name: Publish ZIP into repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/CPT_Silt_Analyzer_Latest.zip
          $changes = git status --porcelain -- release/CPT_Silt_Analyzer_Latest.zip
          if ($changes) {
            git commit -m "Publish latest CPT Silt Analyzer Windows ZIP [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "Release ZIP is already current."
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CPT-Silt-Analyzer-Windows-Professional
          path: desktop_app/dist/CPT_Silt_Analyzer.exe
          retention-days: 30
