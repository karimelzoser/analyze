name: Build CPT Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop_app/**'
      - '.github/workflows/build-desktop.yml'

concurrency:
  group: cpt-windows-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_app/requirements.txt pyinstaller pytest

      - name: Run automated tests
        shell: pwsh
        working-directory: desktop_app
        run: |
          python -m pytest -q

      - name: Professional application smoke test
        shell: pwsh
        working-directory: desktop_app
        run: |
          python -m py_compile app_modern.py app_modern_v2.py app_pdf_enabled.py app_modern_final.py pdf_analysis.py pdf_analysis_refined.py reporting_export_v2.py reporting_pro.py reporting_pdf_ref.py reporting_pdf_ref_v2.py cpt_core.py engineering_layers.py engineering_maps.py engineering_comparison.py engineering_depth_comparison.py engineering_pdf_parity.py engineering_reference_audit.py engineering_workspace.py

      - name: Launch and inspect all GUI workspaces from source
        shell: pwsh
        working-directory: desktop_app
        run: |
          $env:CPT_SCREENSHOT_DIR = "$PWD/gui-screenshots"
          python app_modern_final.py --integration-smoke

      - name: Upload GUI visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CPT-Windows-Visual-QA
          path: desktop_app/gui-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Build executable
        shell: pwsh
        working-directory: desktop_app
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name CPT_Silt_Analyzer `
            --collect-all matplotlib `
            --collect-all pymupdf `
            app_modern_final.py

      - name: Launch the packaged Windows executable and verify GUI
        shell: pwsh
        working-directory: desktop_app
        run: |
          $env:CPT_SMOKE_OUT = "$PWD/packaged-gui-smoke.txt"
          $app = Start-Process -FilePath "$PWD/dist/CPT_Silt_Analyzer.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $app.WaitForExit(90000)) {
            Stop-Process -Id $app.Id -Force
            throw "GUI executable launch timed out."
          }
          if ($app.ExitCode -ne 0) {
            Get-Content $env:CPT_SMOKE_OUT -ErrorAction SilentlyContinue
            throw "Packaged GUI failed with exit code $($app.ExitCode)"
          }
          $content = Get-Content $env:CPT_SMOKE_OUT -Raw -ErrorAction Stop
          Write-Host $content
          if (-not $content.StartsWith("PASS:")) {
            throw "Packaged GUI smoke did not report PASS."
          }

      - name: Package repository download ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if (Test-Path 'release/CPT_Silt_Analyzer_Latest.zip') {
            Remove-Item 'release/CPT_Silt_Analyzer_Latest.zip' -Force
          }
          Compress-Archive `
            -Path 'desktop_app/dist/CPT_Silt_Analyzer.exe' `
            -DestinationPath 'release/CPT_Silt_Analyzer_Latest.zip' `
            -CompressionLevel Optimal
          Get-Item 'release/CPT_Silt_Analyzer_Latest.zip' | Select-Object FullName,Length

      - name: Publish ZIP into repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/CPT_Silt_Analyzer_Latest.zip
          $changes = git status --porcelain -- release/CPT_Silt_Analyzer_Latest.zip
          if ($changes) {
            git commit -m "Publish latest revision-aware CPT Analyzer Windows ZIP [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          } else {
            Write-Host "Release ZIP is already current."
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CPT-Silt-Analyzer-Windows-Revision-Aware
          path: desktop_app/dist/CPT_Silt_Analyzer.exe
          retention-days: 30
