name: Build CPT Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop_app/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_app/requirements.txt pyinstaller pytest

      - name: Run automated tests
        shell: pwsh
        working-directory: desktop_app
        run: |
          python -m pytest -q

      - name: Build executable
        shell: pwsh
        working-directory: desktop_app
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name CPT_Silt_Analyzer `
            --collect-all matplotlib `
            app.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CPT-Silt-Analyzer-Windows
          path: desktop_app/dist/CPT_Silt_Analyzer.exe
          retention-days: 30
